<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/app.css">
<title>Sign up | Flowboard</title>
</head>
<body data-mode="register">
<main class="auth">
  <div class="auth-card">
    <a class="brand" href="/index.html"><span class="brand-mark" aria-hidden="true"><i></i><i></i><i></i><i></i></span> Flowboard</a>
    <h1>Create your account</h1>
    <p class="sub">It takes less than a minute.</p>
    <form id="auth-form" novalidate>
      <div class="form-error" id="form-error" role="alert"></div>
      <label class="l">Name<input class="field" id="name" type="text" autocomplete="name" required maxlength="255"></label>
      <label class="l">Email<input class="field" id="email" type="email" autocomplete="email" required></label>
      <label class="l">Password<input class="field" id="password" type="password" autocomplete="new-password" required minlength="8"></label>
      <button class="btn btn-primary btn-lg" id="submit" type="submit">Create account</button>
    </form>
    <p class="auth-foot">Already have an account? <a href="/login.html">Log in</a></p>
  </div>
</main>
<script src="/js/api.js"></script>
<script src="/js/auth-page.js"></script>
</body>
</html>
